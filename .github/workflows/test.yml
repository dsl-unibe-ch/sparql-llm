name: Tests
on:
  push:
    branches: ["main"]
    tags: [ "v*.*.*" ]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:

  tests:
    name: ✅ Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13"]
        # onnxruntime not available for "3.14"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests
      run: uv run --extra agent pytest

  release:
    name: 🏔️ Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Release notes are written by hand, one file per tag: docs/releases/<tag>.md
      - name: Check the release notes exist
        run: test -f "docs/releases/${{ github.ref_name }}.md" || { echo "::error::Write docs/releases/${{ github.ref_name }}.md before tagging"; exit 1; }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
