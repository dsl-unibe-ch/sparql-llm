services:
  app:
    image: ${SPARQL_LLM_IMAGE:-ghcr.io/dsl-unibe-ch/sparql-llm}:${SPARQL_LLM_VERSION:-latest}
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sparql-llm-data:/app/data
      - sparql-llm-cache:/cache
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  sparql-llm-data:
    name: sparql-llm-data
  sparql-llm-cache:
    name: sparql-llm-cache
